name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]

          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match {expected_tag!r}"
              )
          PY

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile
            image: ghcr.io/idevelopai/databridge-ai-backend
          - component: frontend
            dockerfile: Dockerfile.frontend
            image: ghcr.io/idevelopai/databridge-ai-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Build local release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Prepare release evidence
        run: mkdir -p release-evidence

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}:${{ steps.metadata.outputs.version }}
          output-file: release-evidence/${{ matrix.component }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.metadata.outputs.version }}
          format: sarif
          output: release-evidence/${{ matrix.component }}-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability results
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: release-evidence/${{ matrix.component }}-trivy.sarif
          category: release-${{ matrix.component }}

      - name: Reject fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.metadata.outputs.version }}
          format: table
          output: release-evidence/${{ matrix.component }}-vulnerabilities.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Push verified image tags
        id: push
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          PRIMARY_TAG: ${{ matrix.image }}:${{ steps.metadata.outputs.version }}
        run: |
          while IFS= read -r image_tag; do
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"

          repository_digest="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$PRIMARY_TAG")"
          echo "digest=${repository_digest##*@}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: release-evidence/${{ matrix.component }}.spdx.json
          push-to-registry: true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.component }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "DataBridge AI ${RELEASE_TAG}" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "DataBridge AI ${RELEASE_TAG}" \
              --generate-notes
          fi
