name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Compile Python
        run: >-
          python -m compileall -q agent.py app.py config.py csv_export.py
          ambiguity.py configuration_validation.py database.py
          database_assurance.py database_setup.py feedback.py main.py observability.py
          privacy_policy.py query_log.py query_plan.py rate_limit.py
          recorded_demo.py result_formatting.py schema_service.py
          semantic_layer.py sql_safety.py sql_tools.py unsafe_intent.py
          evaluation tests

      - name: Run tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --requirement requirements-dev.txt

      - name: Audit dependencies
        run: |
          pip-audit --requirement requirements-dev.txt
          pip-audit --requirement requirements-frontend.txt

  containers:
    runs-on: ubuntu-latest
    needs: [test, compatibility, dependency-audit]
    env:
      AI_AGENT_DB_PASSWORD: ci-readonly-password
      APP_SECRET_TOKEN: ci-app-token
      GOOGLE_API_KEY: ci-model-key
      PGADMIN_DEFAULT_PASSWORD: ci-pgadmin-password
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start application
        run: docker compose up --detach --build --wait

      - name: Verify local services
        run: |
          curl --fail --silent http://localhost:8000/ready
          curl --fail --silent http://localhost:8501/_stcore/health
          curl --fail --silent \
            --header "X-API-Key: $APP_SECRET_TOKEN" \
            http://localhost:8000/api/v1/schema \
            | grep --quiet '"employees"'
          curl --fail --silent \
            --header "X-API-Key: $APP_SECRET_TOKEN" \
            http://localhost:8000/metrics \
            | grep --quiet 'databridge_requests_total'
          docker compose exec --no-TTY backend python -m database_setup check
          docker compose exec --no-TTY backend python -m database_setup validate
          docker compose exec --no-TTY backend python -m evaluation.run

      - name: Show service logs
        if: failure()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down --volumes
